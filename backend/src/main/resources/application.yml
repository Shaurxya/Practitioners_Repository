# =============================================================================
# Base configuration. Loaded in every environment.
# application-<profile>.yml is layered on top and wins where they overlap.
#
# ${VAR:default} means "read environment variable VAR, fall back to default".
# That is how the same file works on your laptop and in a real deployment.
# =============================================================================

spring:
  application:
    name: verification-service

  # ---------------------------------------------------------------------------
  # THE SINGLE ENV FILE
  #
  # Spring Boot has no native .env support the way python-dotenv does. What it
  # does have is config import: the [.properties] hint tells it to parse a file
  # with no recognised extension using the properties loader, and KEY=VALUE
  # lines are valid properties syntax. So one repo root .env feeds ${DB_URL} and
  # friends below with nothing exported by hand.
  #
  # "optional:" means a missing file is not an error, which is what makes the
  # same config work in production where no file exists.
  #
  # Two paths because the working directory differs: backend/ when you run
  # mvnw from there, the repo root when you run it from there or from an IDE.
  #
  # Precedence, and the reason this is safe to deploy: real environment
  # variables outrank imported config data in Spring's property source order.
  # A platform injecting DB_PASSWORD always wins over anything in a file.
  # ---------------------------------------------------------------------------
  config:
    # Tests replace this placeholder, rather than attempting to override an
    # import after ConfigData has already read the document containing it.
    import: "${APP_ENV_IMPORTS:optional:file:../.env[.properties],optional:file:./.env[.properties]}"

  # Which extra file to layer on. Override with the SPRING_PROFILES_ACTIVE
  # environment variable, or -Dspring-boot.run.profiles=<name>.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # ---------------------------------------------------------------------------
  # DATASOURCE
  # How to reach Postgres. Spring Boot builds a HikariCP connection pool from
  # this. Nearest equivalent: SQLALCHEMY_DATABASE_URL, or a `pg` Pool config.
  #
  # Port 5433 matches the host side of the mapping in docker-compose.yml.
  # ---------------------------------------------------------------------------
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/verification}
    username: ${DB_USERNAME:verification}
    password: ${DB_PASSWORD:verification}
    hikari:
      # Maximum simultaneous connections held open. 10 is plenty locally.
      maximum-pool-size: 10
      # Fail fast at startup instead of hanging for 30s if Postgres is down.
      # This is what makes "database not running" an obvious error rather than
      # a slow mysterious one.
      connection-timeout: 5000

  # ---------------------------------------------------------------------------
  # JPA / HIBERNATE
  # ---------------------------------------------------------------------------
  jpa:
    hibernate:
      # validate = at startup, compare every @Entity against the real tables and
      # refuse to boot if they disagree. Hibernate NEVER issues DDL.
      # Flyway owns the schema, exclusively and permanently. See README.
      ddl-auto: validate

    # See README for the full explanation. Short version: false closes the
    # database session when the service method returns, instead of keeping it
    # open until the HTTP response is written.
    open-in-view: false

    properties:
      hibernate:
        # Tell Hibernate it is talking to Postgres without making it ask the
        # database at startup. Saves a round trip and removes one failure mode.
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ---------------------------------------------------------------------------
  # FLYWAY
  # Runs pending migrations at startup, before Hibernate validates anything.
  # It creates a flyway_schema_history table and records each applied file.
  # ---------------------------------------------------------------------------
  # Registers are large. The default multipart cap is 1 MB, which rejects every
  # real council register with a message about nothing in particular.
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

  flyway:
    enabled: true
    # Where the .sql files live. "classpath:" means inside src/main/resources.
    locations: classpath:db/migration
    # Re-check the checksum of every already applied file on every boot. If you
    # edit an applied migration, startup fails loudly instead of drifting.
    validate-on-migrate: true

# -----------------------------------------------------------------------------
# APPLICATION
# -----------------------------------------------------------------------------
app:
  # ---------------------------------------------------------------------------
  # AUTHENTICATION
  #
  # Bound to AuthProperties, which holds the defaults. Only the values that
  # differ from those defaults, or that have none, appear here.
  #
  # secret has NO default anywhere, deliberately. A signing key with a default
  # is a signing key everyone who has read this repository knows, and the
  # application refuses to start rather than issue forgeable tokens. Generate
  # one with:  openssl rand -base64 48
  # ---------------------------------------------------------------------------
  auth:
    secret: ${AUTH_SECRET:}
    issuer: herbimmortal-verification

    # Short because it cannot be revoked. This is the maximum delay between
    # locking an account and that taking effect. Raising it trades that
    # guarantee for slightly fewer refresh calls, which is a bad trade.
    access-token-ttl: 15m

    # Long because it can be revoked, and because being signed out weekly is
    # what makes people pick worse passwords.
    refresh-token-ttl: 30d

    max-failed-logins: 8
    lock-duration: 15m

    # Also the maximum delay between revoking an API key and it stopping working
    # on another instance. Revocation on this instance is immediate.
    api-key-cache-ttl: 60s
    api-key-use-window: 5m

    # The first administrator, created once on an empty database and ignored
    # forever after. Not set here: it comes from .env so this file never
    # contains a credential. See BootstrapAdmin.
    bootstrap-admin-email: ${AUTH_BOOTSTRAP_ADMIN_EMAIL:}
    bootstrap-admin-password: ${AUTH_BOOTSTRAP_ADMIN_PASSWORD:}

  # ---------------------------------------------------------------------------
  # PDF extraction sidecar
  #
  # Two timeouts because the two calls are nothing alike: classification counts
  # characters and returns in seconds, extraction on a scanned 400 page register
  # is an OCR run. One timeout would either kill every real extraction or let a
  # dead sidecar hang a request for half an hour.
  # ---------------------------------------------------------------------------
  extraction:
    base-url: ${EXTRACTION_URL:http://localhost:8000}
    classify-timeout: ${EXTRACTION_CLASSIFY_TIMEOUT:2m}
    extract-timeout: ${EXTRACTION_EXTRACT_TIMEOUT:30m}
    upload-dir: ${UPLOAD_DIR:../data/uploads}

  # ---------------------------------------------------------------------------
  # IDENTITY DOCUMENTS
  #
  # The photo ID and the liveness selfie. The most sensitive data this system
  # holds, so two things here are not optional.
  #
  # master-key has NO default, exactly like auth.secret. It wraps the per
  # document key that protects a government ID, and a default would be one
  # everybody who has read this repository holds. The application refuses to
  # start without it. Generate with:  openssl rand -base64 32
  #
  # endpoint points at MinIO locally. Leave it empty against real S3 and the
  # SDK resolves the region's endpoint itself. Nothing else changes: MinIO
  # speaks the S3 API, which is why the AWS SDK is the dependency rather than
  # the MinIO client.
  # ---------------------------------------------------------------------------
  documents:
    master-key: ${DOCUMENT_MASTER_KEY:}
    bucket: ${DOCUMENT_BUCKET:identity-documents}
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ROOT_USER:verification}
    secret-key: ${MINIO_ROOT_PASSWORD:verification-minio}
    region: ${DOCUMENT_REGION:us-east-1}
    # 10 MB. A phone photo of a passport is one to four; past this it is a
    # video or a mistake, and both should be refused before being read into
    # memory rather than after.
    max-bytes: ${DOCUMENT_MAX_BYTES:10485760}
    # Days after a case goes terminal before the document key is destroyed.
    # There is no reason to hold a government ID forever: the decision, the
    # rule results and the registry snapshot are the durable record.
    retain-after-decision-days: ${DOCUMENT_RETENTION_DAYS:90}

  ingest:
    # Path is relative to the working directory, which is backend/ when you run
    # mvnw from there. Override with APP_INGEST_FILE.
    file: ${APP_INGEST_FILE:../data/registry_synthetic.csv}
    # Rows per JDBC batch. See RegistryIngestionService.flush for the tradeoff.
    batch-size: ${APP_INGEST_BATCH_SIZE:500}

server:
  port: ${SERVER_PORT:8080}

# -----------------------------------------------------------------------------
# ACTUATOR
# Actuator has many endpoints. Exposing only health is deliberate: the others
# (env, beans, mappings, heapdump) leak internals and must be opt in.
# -----------------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # never / when-authorized / always. Base default is conservative,
      # application-local.yml turns it up to always for development.
      show-details: never
