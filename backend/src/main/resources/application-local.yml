# =============================================================================
# Local development only. Active because application.yml sets
# spring.profiles.active to "local" by default.
#
# Anything noisy or revealing belongs here, never in application.yml.
# =============================================================================

spring:
  # No datasource block here on purpose. application.yml already points at the
  # Docker Compose Postgres on localhost:5433, and every setting there reads an
  # environment variable first, so a different database is DB_URL / DB_USERNAME /
  # DB_PASSWORD in the shell rather than a credential written into a file that
  # git is tracking.
  jpa:
    # Print every SQL statement Hibernate generates. Equivalent to
    # SQLAlchemy's echo=True. Very useful while learning, far too noisy in
    # production, which is why it is only in this file.
    show-sql: true
    properties:
      hibernate:
        # Pretty print that SQL across multiple lines instead of one long line.
        format_sql: true

logging:
  level:
    # DEBUG for our own code only, so the log is readable.
    com.herbimmortal.verification: DEBUG
    # show-sql prints the statement but writes "?" for every parameter.
    # Never print credentials, hashes, codes, or identity values from SQL bindings.
    org.hibernate.orm.jdbc.bind: OFF
    org.springframework.jdbc.core: WARN
    # Confirms which migrations Flyway found and applied, on every boot.
    org.flywaydb: INFO

management:
  endpoint:
    health:
      # THE POINT OF THIS EXERCISE. Without "always", /actuator/health returns
      # only {"status":"UP"} and you cannot tell whether the database is
      # actually reachable. With it, the response lists a "db" component with
      # its own status, which is the proof that the app really connected.
      show-details: always
