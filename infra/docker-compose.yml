# Local infrastructure only. The Spring app and the Vite dev server run on the
# host, not in here, so you keep hot reload and a debugger.
#
#   docker compose -f infra/docker-compose.yml up -d
#   docker compose -f infra/docker-compose.yml down        keeps the volumes
#   docker compose -f infra/docker-compose.yml down -v     wipes the database

name: herbimmortal-verification

services:
  postgres:
    image: postgres:16-alpine
    container_name: hi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-herbimmortal}
      POSTGRES_USER: ${POSTGRES_USER:-herbimmortal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-herbimmortal}
    ports:
      # host:container. 5433 on the host on purpose: a Postgres installed
      # directly on the machine usually already owns 5432, and localhost would
      # resolve to that one instead of this container.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Without this, the app can start before Postgres accepts connections.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-herbimmortal} -d ${POSTGRES_DB:-herbimmortal}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: hi-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"    # S3 API, what the backend talks to
      - "${MINIO_CONSOLE_PORT:-9001}:9001"  # web console, http://localhost:9001
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs once, creates the bucket, exits. Without it the first upload fails
  # against an empty MinIO with NoSuchBucket.
  minio-init:
    image: minio/mc:latest
    container_name: hi-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/${MINIO_BUCKET:-herbimmortal-documents} &&
      echo 'bucket ready';
      "

volumes:
  postgres-data:
  minio-data:
