# Local PostgreSQL for verification-service.
#
# The app itself runs on your machine (via mvnw), not in here, so you keep
# hot reload and a debugger. This file only provides the database.
#
#   docker compose up -d       start in the background
#   docker compose ps          check health
#   docker compose down        stop, keep the data
#   docker compose down -v     stop and wipe the data

name: verification-service

services:
  postgres:
    image: postgres:16-alpine
    container_name: verification-postgres
    # Comes back automatically after a Docker Desktop or machine restart,
    # but not if you stopped it yourself with `docker compose down`.
    restart: unless-stopped

    environment:
      # The official Postgres image reads these on FIRST START ONLY, when it
      # initialises an empty data directory. Changing them later does nothing
      # until you `docker compose down -v` and let it initialise again.
      #
      # Values come from the repo root .env, which Compose loads automatically
      # because this file sits next to it. The :-defaults keep `docker compose
      # up` working on a checkout where .env has not been created yet.
      POSTGRES_DB: ${POSTGRES_DB:-verification}
      POSTGRES_USER: ${POSTGRES_USER:-verification}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-verification}

    ports:
      # host:container. 5433 on the host on purpose: if you already have
      # Postgres installed on Windows it owns 5432, and "localhost:5432" would
      # silently resolve to that one instead of this container.
      # Inside the container it is still the normal 5432.
      - "${POSTGRES_PORT:-5433}:5432"

    volumes:
      # Named volume, managed by Docker. Survives `down`, removed by `down -v`.
      # A bind mount to a Windows folder would be slower and hits file
      # permission problems, so a named volume is the right default here.
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      # "Container started" and "Postgres accepts connections" are different
      # moments, several seconds apart. pg_isready tests the second one, which
      # is the one that matters. `docker compose ps` shows (healthy) only once
      # this passes.
      # $$ escapes Compose's own interpolation, so the shell inside the
      # container expands these from the environment block above rather than
      # Compose substituting them here. Otherwise changing the user in .env
      # leaves the healthcheck probing a role that no longer exists.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s      # how often to run the check
      timeout: 5s       # how long one check may take before counting as failed
      retries: 10       # consecutive failures before the container is unhealthy
      start_period: 10s # grace window at boot where failures do not count

  # ---------------------------------------------------------------------------
  # PDF extraction sidecar
  #
  # Bound to loopback on purpose. This service takes a file path and returns
  # registry rows, it has no authentication of its own, and it must never be
  # reachable from anywhere except Spring. That is layer 1 of the access control
  # described in RequireAdmin.
  # ---------------------------------------------------------------------------
  extraction:
    build: ./extraction
    container_name: verification-extraction
    restart: unless-stopped
    ports:
      - "127.0.0.1:${EXTRACTION_PORT:-8000}:8000"
    volumes:
      # Read only. The sidecar reads uploaded registers and writes nothing.
      - ./data/uploads:/srv/uploads:ro
    environment:
      LOG_LEVEL: ${EXTRACTION_LOG_LEVEL:-INFO}

  # ---------------------------------------------------------------------------
  # Object storage for identity documents
  #
  # MinIO speaks the S3 API, so the same code runs here and against real S3 with
  # nothing but an endpoint change. Section 2 names it, and this is the phase
  # that finally needs it.
  #
  # What lands in this bucket is the most sensitive data the system holds: a
  # government photo ID and a selfie. Two consequences visible in this file.
  #
  # Bound to loopback, like the extraction sidecar. Nothing outside this machine
  # has any business reaching it, and the console port is where an unauthicated
  # browse of the whole bucket would come from.
  #
  # The objects are encrypted BEFORE they arrive, by DocumentCipher, with a key
  # per document that MinIO never sees. So a stolen volume is ciphertext, and
  # deleting one person's key destroys their images while leaving the audit
  # trail intact. That is the crypto shredding non negotiable 1 and section 10
  # need in order to coexist.
  # ---------------------------------------------------------------------------
  minio:
    # Pinned by digest rather than by tag. MinIO's release tags are timestamps
    # that move faster than this project will, and "latest" would mean the
    # storage layer under a government ID changes version on whichever day
    # somebody happens to rebuild. A digest is the only reference that cannot
    # silently become a different image.
    image: cgr.dev/chainguard/minio:latest
    container_name: verification-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"

    environment:
      # First start only, same as Postgres above. These are the storage
      # credentials Spring authenticates with, not anything a user sees.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-verification}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-verification-minio}

    ports:
      # API and console, both loopback only. Publishing 9001 to the network
      # would put a full object browser on the LAN.
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"

    volumes:
      - minio-data:/data

    healthcheck:
      # "Container started" and "MinIO is ready to serve" are different moments.
      # Spring creates the bucket at startup and needs the second one.
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
  minio-data:
