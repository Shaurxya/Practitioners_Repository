name: backend

on:
  push:
    branches: [main]
    paths: ['backend/**', 'tools/ci/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', 'tools/ci/**', '.github/workflows/backend.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
        env:
          POSTGRES_DB: verification_test
          POSTGRES_USER: verification_test
          POSTGRES_PASSWORD: herbimmortal-test-only-postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U verification_test -d verification_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DB_URL: jdbc:postgresql://localhost:5432/verification_test
      DB_USERNAME: verification_test
      DB_PASSWORD: herbimmortal-test-only-postgres
      MINIO_ENDPOINT: http://localhost:19000
      MINIO_ROOT_USER: verification-test
      MINIO_ROOT_PASSWORD: herbimmortal-test-only-storage

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Start disposable MinIO
        run: |
          docker run --rm --detach --name verification-ci-minio \
            --publish 127.0.0.1:19000:9000 \
            --env MINIO_ROOT_USER --env MINIO_ROOT_PASSWORD \
            cgr.dev/chainguard/minio@sha256:a1ac4589a5f8136b616e667b48a0bea9719bb10bd45799ea946f24bbedfafde4 \
            server /data
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 1 "$MINIO_ENDPOINT/minio/health/live"; then exit 0; fi
            sleep 1
          done
          echo "MinIO did not become ready."
          exit 1
      - name: Verify report-gate regression tests
        run: python3 -m unittest discover -s tools/ci -p 'test_*.py' -v
      - name: Build and test against fresh PostgreSQL and MinIO
        working-directory: backend
        run: ./mvnw -B -ntp clean verify -DskipTests=false -Dmaven.test.skip=false
      - name: Require database/storage canaries and zero skips
        if: always()
        run: |
          python3 tools/ci/check_test_reports.py backend/target/surefire-reports \
            --required com.herbimmortal.verification.CiDatabaseCanaryTest \
            --required com.herbimmortal.verification.storage.ObjectStoreIntegrationTest
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          if-no-files-found: error
          retention-days: 7
      - name: Stop disposable MinIO
        if: always()
        run: docker stop verification-ci-minio
